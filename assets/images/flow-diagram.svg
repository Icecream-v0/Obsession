<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="distraction" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a4a4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6a6a6a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="obsession" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#1a1a2e"/>
  
  <!-- Title -->
  <text x="400" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">THE OBSESSION FLOW</text>
  
  <!-- Distraction State (Left) -->
  <g transform="translate(100, 120)">
    <rect x="0" y="0" width="200" height="150" rx="10" fill="#2a2a3e" stroke="#4a4a4a" stroke-width="2"/>
    <text x="100" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#888" text-anchor="middle">DISTRACTION</text>
    
    <!-- Scattered dots -->
    <circle cx="50" cy="60" r="8" fill="#666" opacity="0.6"/>
    <circle cx="120" cy="70" r="6" fill="#666" opacity="0.5"/>
    <circle cx="80" cy="100" r="7" fill="#666" opacity="0.4"/>
    <circle cx="150" cy="90" r="5" fill="#666" opacity="0.6"/>
    <circle cx="60" cy="120" r="6" fill="#666" opacity="0.5"/>
    
    <!-- Chaotic lines -->
    <path d="M 30 50 Q 60 40 80 60 T 120 70" stroke="#555" stroke-width="2" fill="none" opacity="0.4"/>
    <path d="M 40 80 Q 70 90 100 75 T 140 85" stroke="#555" stroke-width="2" fill="none" opacity="0.4"/>
    <path d="M 50 110 Q 80 100 110 115 T 160 105" stroke="#555" stroke-width="2" fill="none" opacity="0.4"/>
    
    <text x="100" y="140" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">Scattered Focus</text>
  </g>
  
  <!-- Arrow -->
  <g transform="translate(320, 180)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#e94560" stroke-width="3"/>
    <polygon points="60,0 50,-8 50,8" fill="#e94560"/>
    <text x="30" y="-15" font-family="Arial, sans-serif" font-size="14" fill="#e94560" text-anchor="middle">OBSESSION-AI</text>
  </g>
  
  <!-- Obsession State (Right) -->
  <g transform="translate(500, 120)">
    <rect x="0" y="0" width="200" height="150" rx="10" fill="#2a2a3e" stroke="url(#obsession)" stroke-width="3" filter="url(#glow)"/>
    <text x="100" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e94560" text-anchor="middle">OBSESSION</text>
    
    <!-- Focused core -->
    <circle cx="100" cy="75" r="30" fill="#e94560" opacity="0.3"/>
    <circle cx="100" cy="75" r="20" fill="#e94560" opacity="0.6"/>
    <circle cx="100" cy="75" r="10" fill="#ff6b6b" filter="url(#glow)"/>
    
    <!-- Concentric rings -->
    <circle cx="100" cy="75" r="40" stroke="#e94560" stroke-width="1" fill="none" opacity="0.4"/>
    <circle cx="100" cy="75" r="50" stroke="#e94560" stroke-width="1" fill="none" opacity="0.3"/>
    <circle cx="100" cy="75" r="60" stroke="#e94560" stroke-width="1" fill="none" opacity="0.2"/>
    
    <!-- Radiating lines -->
    <line x1="100" y1="35" x2="100" y2="25" stroke="#e94560" stroke-width="2" opacity="0.6"/>
    <line x1="100" y1="115" x2="100" y2="125" stroke="#e94560" stroke-width="2" opacity="0.6"/>
    <line x1="60" y1="75" x2="50" y2="75" stroke="#e94560" stroke-width="2" opacity="0.6"/>
    <line x1="140" y1="75" x2="150" y2="75" stroke="#e94560" stroke-width="2" opacity="0.6"/>
    
    <text x="100" y="140" font-family="Arial, sans-serif" font-size="12" fill="#e94560" text-anchor="middle">Laser Focus</text>
  </g>
  
  <!-- Process Steps (Bottom) -->
  <g transform="translate(100, 350)">
    <!-- Step 1 -->
    <g>
      <rect x="0" y="0" width="180" height="100" rx="8" fill="#2a2a3e" stroke="#4a4a4a" stroke-width="1"/>
      <circle cx="30" cy="30" r="15" fill="#4a4a4a"/>
      <text x="30" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
      <text x="60" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">Identify Task</text>
      <text x="60" y="50" font-family="Arial, sans-serif" font-size="11" fill="#888">Define clear objective</text>
      <text x="60" y="70" font-family="Arial, sans-serif" font-size="11" fill="#888">Break into steps</text>
    </g>
    
    <!-- Arrow -->
    <g transform="translate(190, 45)">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#666" stroke-width="2"/>
      <polygon points="30,0 22,-5 22,5" fill="#666"/>
    </g>
    
    <!-- Step 2 -->
    <g transform="translate(230, 0)">
      <rect x="0" y="0" width="180" height="100" rx="8" fill="#2a2a3e" stroke="#e94560" stroke-width="2"/>
      <circle cx="30" cy="30" r="15" fill="#e94560"/>
      <text x="30" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
      <text x="60" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e94560">Activate Mode</text>
      <text x="60" y="50" font-family="Arial, sans-serif" font-size="11" fill="#888">AI reformats output</text>
      <text x="60" y="70" font-family="Arial, sans-serif" font-size="11" fill="#888">Action-first responses</text>
    </g>
    
    <!-- Arrow -->
    <g transform="translate(420, 45)">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#666" stroke-width="2"/>
      <polygon points="30,0 22,-5 22,5" fill="#666"/>
    </g>
    
    <!-- Step 3 -->
    <g transform="translate(460, 0)">
      <rect x="0" y="0" width="180" height="100" rx="8" fill="#2a2a3e" stroke="#e94560" stroke-width="2"/>
      <circle cx="30" cy="30" r="15" fill="#ff6b6b"/>
      <text x="30" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
      <text x="60" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ff6b6b">Enter Flow</text>
      <text x="60" y="50" font-family="Arial, sans-serif" font-size="11" fill="#888">Hyperfocus engaged</text>
      <text x="60" y="70" font-family="Arial, sans-serif" font-size="11" fill="#888">Productivity unlocked</text>
    </g>
  </g>
  
  <!-- Bottom tagline -->
  <text x="400" y="520" font-family="Arial, sans-serif" font-size="18" font-style="italic" fill="#e94560" text-anchor="middle">"Turn distraction into obsession"</text>
  <text x="400" y="545" font-family="Arial, sans-serif" font-size="14" fill="#666" text-anchor="middle">Powered by OBSESSION-AI v2.0</text>
</svg>
