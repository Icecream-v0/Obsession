<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e94560;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#e94560" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Abstract neural network pattern -->
  <g opacity="0.1" stroke="#e94560" stroke-width="2" fill="none">
    <circle cx="200" cy="150" r="30"/>
    <circle cx="400" cy="200" r="25"/>
    <circle cx="600" cy="150" r="35"/>
    <circle cx="800" cy="250" r="20"/>
    <circle cx="1000" cy="180" r="30"/>
    <circle cx="300" cy="400" r="40"/>
    <circle cx="500" cy="450" r="30"/>
    <circle cx="700" cy="400" r="35"/>
    <circle cx="900" cy="450" r="25"/>
    <line x1="200" y1="150" x2="400" y2="200"/>
    <line x1="400" y1="200" x2="600" y2="150"/>
    <line x1="600" y1="150" x2="800" y2="250"/>
    <line x1="800" y1="250" x2="1000" y2="180"/>
    <line x1="300" y1="400" x2="500" y2="450"/>
    <line x1="500" y1="450" x2="700" y2="400"/>
    <line x1="700" y1="400" x2="900" y2="450"/>
    <line x1="400" y1="200" x2="500" y2="450"/>
    <line x1="600" y1="150" x2="700" y2="400"/>
  </g>
  
  <!-- Main Logo Circle -->
  <circle cx="600" cy="315" r="120" fill="none" stroke="url(#glow)" stroke-width="4" filter="url(#shadow)"/>
  <circle cx="600" cy="315" r="100" fill="none" stroke="#e94560" stroke-width="2" opacity="0.6"/>
  <circle cx="600" cy="315" r="80" fill="none" stroke="#e94560" stroke-width="2" opacity="0.4"/>
  
  <!-- Focus Point -->
  <circle cx="600" cy="315" r="40" fill="#e94560" filter="url(#shadow)"/>
  <circle cx="600" cy="315" r="20" fill="#fff"/>
  
  <!-- Radiating lines -->
  <g stroke="#e94560" stroke-width="2" opacity="0.6">
    <line x1="600" y1="150" x2="600" y2="195"/>
    <line x1="600" y1="435" x2="600" y2="480"/>
    <line x1="480" y1="315" x2="520" y2="315"/>
    <line x1="680" y1="315" x2="720" y2="315"/>
    <line x1="515" y1="230" x2="545" y2="260"/>
    <line x1="685" y1="230" x2="655" y2="260"/>
    <line x1="515" y1="400" x2="545" y2="370"/>
    <line x1="685" y1="400" x2="655" y2="370"/>
  </g>
  
  <!-- Text -->
  <text x="600" y="520" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#fff" text-anchor="middle" letter-spacing="4">OBSESSION-AI</text>
  <text x="600" y="560" font-family="Arial, sans-serif" font-size="24" fill="#e94560" text-anchor="middle" letter-spacing="2">TURN DISTRACTION INTO OBSESSION</text>
</svg>
