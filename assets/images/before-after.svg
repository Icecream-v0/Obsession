<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d9a5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="600" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="450" y="50" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#fff" text-anchor="middle">BEFORE vs AFTER OBSESSION-AI</text>
  
  <!-- BEFORE Panel -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="380" height="450" rx="15" fill="#2a2a3e" stroke="#666" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="380" height="50" rx="15" fill="#3a3a4e"/>
    <rect x="0" y="20" width="380" height="30" fill="#3a3a4e"/>
    <text x="190" y="32" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#888" text-anchor="middle">❌ WITHOUT OBSESSION-AI</text>
    
    <!-- Example content - messy -->
    <g transform="translate(20, 70)">
      <text x="0" y="0" font-family="monospace" font-size="11" fill="#aaa">AI Response:</text>
      
      <!-- Long preamble -->
      <text x="0" y="25" font-family="monospace" font-size="10" fill="#666">"That's a great question! Let me help you</text>
      <text x="0" y="40" font-family="monospace" font-size="10" fill="#666">understand this concept. First, it's important</text>
      <text x="0" y="55" font-family="monospace" font-size="10" fill="#666">to note that there are several approaches...</text>
      
      <!-- Wall of text -->
      <text x="0" y="85" font-family="monospace" font-size="9" fill="#555">• You could try method A which involves</text>
      <text x="20" y="100" font-family="monospace" font-size="9" fill="#555">setting up the environment first</text>
      <text x="0" y="120" font-family="monospace" font-size="9" fill="#555">• Method B is another option but requires</text>
      <text x="20" y="135" font-family="monospace" font-size="9" fill="#555">additional dependencies to be installed</text>
      <text x="0" y="155" font-family="monospace" font-size="9" fill="#555">• There's also method C though it's less</text>
      <text x="20" y="170" font-family="monospace" font-size="9" fill="#555">commonly used in production environments</text>
      
      <!-- Tangent -->
      <text x="0" y="200" font-family="monospace" font-size="9" fill="#444">"By the way, I should mention that this</text>
      <text x="0" y="215" font-family="monospace" font-size="9" fill="#444">relates to a broader pattern in software</text>
      <text x="0" y="230" font-family="monospace" font-size="9" fill="#444">architecture that's worth exploring..."</text>
      
      <!-- No clear action -->
      <text x="0" y="260" font-family="monospace" font-size="9" fill="#444">"Let me know if you need more details!"</text>
      
      <!-- Pain points -->
      <g transform="translate(0, 290)">
        <rect x="0" y="0" width="340" height="120" rx="8" fill="#3a1a1a" stroke="#e94560" stroke-width="1"/>
        <text x="170" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e94560" text-anchor="middle">USER PAIN POINTS:</text>
        <text x="20" y="50" font-family="Arial, sans-serif" font-size="11" fill="#aa6666">✗ Where do I start?</text>
        <text x="20" y="70" font-family="Arial, sans-serif" font-size="11" fill="#aa6666">✗ Too much information</text>
        <text x="20" y="90" font-family="Arial, sans-serif" font-size="11" fill="#aa6666">✗ Lost in tangents</text>
        <text x="20" y="110" font-family="Arial, sans-serif" font-size="11" fill="#aa6666">✗ No clear next step</text>
      </g>
    </g>
  </g>
  
  <!-- Arrow -->
  <g transform="translate(440, 300)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="url(#red)" stroke-width="4"/>
    <polygon points="40,0 30,-8 30,8" fill="url(#red)"/>
    <text x="20" y="-15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e94560" text-anchor="middle">ACTIVATE</text>
  </g>
  
  <!-- AFTER Panel -->
  <g transform="translate(470, 100)">
    <rect x="0" y="0" width="380" height="450" rx="15" fill="#2a2a3e" stroke="url(#red)" stroke-width="3" filter="url(#shadow)"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="380" height="50" rx="15" fill="#3a1a2a"/>
    <rect x="0" y="20" width="380" height="30" fill="#3a1a2a"/>
    <text x="190" y="32" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#e94560" text-anchor="middle">✅ WITH OBSESSION-AI</text>
    
    <!-- Example content - focused -->
    <g transform="translate(20, 70)">
      <text x="0" y="0" font-family="monospace" font-size="11" fill="#e94560">▶ Run: npm install express</text>
      
      <!-- Numbered steps -->
      <text x="0" y="30" font-family="monospace" font-size="11" fill="#fff">Step 1 of 3: Create server.js</text>
      <text x="0" y="50" font-family="monospace" font-size="10" fill="#00ff88">const express = require('express');</text>
      <text x="0" y="65" font-family="monospace" font-size="10" fill="#00ff88">const app = express();</text>
      
      <text x="0" y="95" font-family="monospace" font-size="11" fill="#fff">Step 2 of 3: Add route</text>
      <text x="0" y="115" font-family="monospace" font-size="10" fill="#00ff88">app.get('/', (req, res) =&gt; {</text>
      <text x="20" y="130" font-family="monospace" font-size="10" fill="#00ff88">res.send('Hello World');</text>
      <text x="0" y="145" font-family="monospace" font-size="10" fill="#00ff88">});</text>
      
      <text x="0" y="175" font-family="monospace" font-size="11" fill="#fff">Step 3 of 3: Start server</text>
      <text x="0" y="195" font-family="monospace" font-size="10" fill="#00ff88">node server.js  # Runs on :3000</text>
      
      <!-- Clear next action -->
      <g transform="translate(0, 225)">
        <rect x="0" y="0" width="340" height="50" rx="8" fill="#1a3a2a" stroke="#00d9a5" stroke-width="2"/>
        <text x="170" y="30" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#00ff88" text-anchor="middle">NEXT: Open http://localhost:3000</text>
      </g>
      
      <!-- Benefits -->
      <g transform="translate(0, 290)">
        <rect x="0" y="0" width="340" height="120" rx="8" fill="#1a3a2a" stroke="#00d9a5" stroke-width="1"/>
        <text x="170" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#00ff88" text-anchor="middle">USER BENEFITS:</text>
        <text x="20" y="50" font-family="Arial, sans-serif" font-size="11" fill="#88ffbb">✓ Action first, immediately</text>
        <text x="20" y="70" font-family="Arial, sans-serif" font-size="11" fill="#88ffbb">✓ Numbered steps (1-3)</text>
        <text x="20" y="90" font-family="Arial, sans-serif" font-size="11" fill="#88ffbb">✓ No tangents, focused</text>
        <text x="20" y="110" font-family="Arial, sans-serif" font-size="11" fill="#88ffbb">✓ Clear next action shown</text>
      </g>
    </g>
  </g>
  
  <!-- Bottom tagline -->
  <text x="450" y="575" font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#e94560" text-anchor="middle">"From overwhelmed to obsessed in one command"</text>
</svg>
